<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>FIG · App</title>
<meta name="description" content="La app de FEN Investment Group: ranking del Torneo Portafolio, tabla del Alpha Trading Challenge y eventos del club.">
<meta name="theme-color" content="#0A1128">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../logos/fig-oro.png">
<link rel="apple-touch-icon" href="../iconos/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FIG">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<!--
  La app pública de FIG (lo que abre el ícono instalado; manifest.webmanifest
  de la raíz la tiene de start_url). Etapa 1, pedida por Francisco el
  2026-09-25: solo tres cosas —
    Portafolio  ← datos/torneo-tabla.json (el corte semanal de Bloomberg)
    Trading     ← la tabla que sube el área Trading desde FIG Directivos (Apps Script, en vivo)
    Eventos     ← datos/eventos.json + lo que publican los directivos (Apps Script, en vivo)
  Si el Apps Script no responde, Portafolio y los eventos del repo se ven igual.
-->
<style>
:root{
  --navy:#0A1128; --navy-2:#111B3A; --navy-3:#1A2750; --oro:#D4AF37; --oro-2:#EBD388;
  --ivory:#F7F4EC; --dim:#A9B1C7; --line:rgba(255,255,255,.1); --up:#3CCB7F; --down:#FF6B6B;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--navy);color:var(--ivory);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
a{color:var(--oro-2)}
button{font:inherit;cursor:pointer;color:inherit}

.barra{position:sticky;top:0;z-index:10;background:rgba(10,17,40,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.barra img{width:30px;height:30px}
.barra b{font-size:15px;letter-spacing:.01em}
.barra small{display:block;font-size:11px;color:var(--dim);font-weight:400}

main{max-width:640px;margin:0 auto;padding:16px 16px calc(90px + env(safe-area-inset-bottom))}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--oro);font-weight:700;margin:6px 0 2px}
h1{font-size:24px;margin:0 0 4px;line-height:1.2}
.sub{color:var(--dim);font-size:13px;margin:0 0 16px}

.pestanas{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--navy-2);border-top:1px solid var(--line);
  display:flex;padding-bottom:env(safe-area-inset-bottom)}
.pestanas button{flex:1;background:none;border:none;color:var(--dim);padding:9px 4px 8px;font-size:11px;
  display:flex;flex-direction:column;align-items:center;gap:3px}
.pestanas svg{width:22px;height:22px}
.pestanas button[aria-selected="true"]{color:var(--oro)}

/* ranking */
.eq{background:var(--navy-2);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;overflow:hidden}
.eq>button{width:100%;background:none;border:none;display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;
  padding:12px 14px;text-align:left}
.pos{font-weight:800;font-size:17px;color:var(--dim);text-align:center}
.eq.top .pos{color:var(--oro)}
.nom{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nom small{display:block;font-weight:400;font-size:12px;color:var(--dim)}
.pts{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.pts small{display:block;font-weight:400;font-size:11px;color:var(--dim)}
.up{color:var(--up)}.down{color:var(--down)}
.det{padding:0 14px 14px 58px;font-size:13px;color:var(--dim)}
.det dl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 10px}
.det dt{font-size:10px;text-transform:uppercase;letter-spacing:.06em}
.det dd{margin:0;color:var(--ivory);font-weight:600;font-variant-numeric:tabular-nums}

/* tabla trading */
.tabla{overflow-x:auto;background:var(--navy-2);border:1px solid var(--line);border-radius:14px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim)}
tr:last-child td{border-bottom:none}
tbody tr:nth-child(-n+3) td:first-child{color:var(--oro);font-weight:700}

/* tarjetas */
.card{background:var(--navy-2);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:10px}
.card h3{margin:0 0 4px;font-size:16px}
.card p{margin:0;color:var(--dim);font-size:14px;white-space:pre-line}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;margin:12px 0}
.kv dt{color:var(--dim)}.kv dd{margin:0}
.btn{display:inline-block;background:var(--oro);color:#1B1403;border:none;border-radius:999px;padding:12px 20px;font-weight:700;text-decoration:none}
.chip{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;
  border-radius:999px;background:var(--navy-3);color:var(--oro-2);margin-right:4px}
.chip.prox{background:var(--oro);color:#1B1403}

.com{border-left:3px solid var(--oro)}
.com .meta,.ev .meta{font-size:12px;color:var(--dim);margin-bottom:6px}

.ev{display:block;width:100%;text-align:left;background:var(--navy-2);border:1px solid var(--line);border-radius:14px;
  overflow:hidden;margin-bottom:10px;padding:0}
.ev .foto{aspect-ratio:16/9;background:var(--navy-3) center/cover no-repeat}
.ev .cuerpo{padding:12px 14px 14px}
.ev h3{margin:0 0 4px;font-size:16px}
.ev p{margin:0;color:var(--dim);font-size:13px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.seccion{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:22px 0 10px;font-weight:700}

/* detalle de evento */
.hoja{position:fixed;inset:0;z-index:20;background:var(--navy);overflow-y:auto;padding:calc(12px + env(safe-area-inset-top)) 0 40px}
.hoja .cerrar{position:sticky;top:0;margin:0 16px 10px;background:var(--navy-3);border:none;border-radius:999px;padding:8px 14px}
.hoja .gal{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 16px}
.hoja .gal img{height:240px;border-radius:12px;scroll-snap-align:center;flex:0 0 auto;max-width:88vw;object-fit:cover}
.hoja .txt{max-width:640px;margin:0 auto;padding:16px}
.hoja .txt p{color:var(--ivory);white-space:pre-line}

.vacio{color:var(--dim);font-size:14px;padding:28px 0;text-align:center}
.pie{text-align:center;font-size:12px;color:var(--dim);margin-top:26px}
</style>
</head>
<body>

<header class="barra">
  <img src="../logos/fig-oro.png" alt="">
  <div><b>FEN Investment Group</b><small id="barraSub">Torneos y eventos del club</small></div>
</header>

<main>
  <section id="v-portafolio" hidden>
    <p class="eyebrow">Torneo Portafolio 2026</p>
    <h1>Ranking</h1>
    <p class="sub" id="pCorte">Cargando…</p>
    <div id="pLista"></div>
  </section>

  <section id="v-trading" hidden>
    <p class="eyebrow">Alpha Trading Challenge · XTB</p>
    <h1>Tabla de Trading</h1>
    <div id="tCont"><p class="vacio">Cargando…</p></div>
  </section>

  <section id="v-eventos" hidden>
    <p class="eyebrow">Comunidad FIG</p>
    <h1>Eventos</h1>
    <div id="eCom"></div>
    <div id="eLista"><p class="vacio">Cargando…</p></div>
  </section>

  <p class="pie"><a href="../index.html">Ver el sitio completo</a></p>
</main>

<nav class="pestanas" role="tablist">
  <button role="tab" data-v="portafolio" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Portafolio</button>
  <button role="tab" data-v="trading" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></svg>Trading</button>
  <button role="tab" data-v="eventos" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Eventos</button>
</nav>

<div class="hoja" id="hoja" hidden></div>

<script>
"use strict";
function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return [].slice.call((r||document).querySelectorAll(s))}
function esc(t){return String(t==null?"":t).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function json(url){return fetch(url,{cache:"no-cache"}).then(function(r){return r.ok?r.json():null}).catch(function(){return null})}
/* El Apps Script puede tardar o no estar: nunca más de 8 s, y null si falla. */
function vivo(tipo){
  return ENDPOINT.then(function(ep){
    if(!ep)return null;
    var ctl=window.AbortController?new AbortController():null;
    if(ctl)setTimeout(function(){ctl.abort()},8000);
    return fetch(ep+"?tipo="+tipo,{cache:"no-store",signal:ctl&&ctl.signal}).then(function(r){return r.json()}).catch(function(){return null});
  });
}
var ENDPOINT=json("../datos/club.json").then(function(d){return (d&&d.config&&d.config.figEndpoint)||""});
var MESES=["ENE","FEB","MAR","ABR","MAY","JUN","JUL","AGO","SEP","OCT","NOV","DIC"];
function fechaTexto(iso){var p=String(iso||"").slice(0,10).split("-");return p.length===3?(+p[2])+" · "+MESES[+p[1]-1]+" · "+p[0]:""}
function fotoDrive(id,w){return "https://drive.google.com/thumbnail?id="+encodeURIComponent(id)+"&sz=w"+(w||800)}
function pct(x){return (x>=0?"+":"")+(x*100).toFixed(1)+"%"}

/* ---------- pestañas (la elegida queda en el #) ---------- */
var VISTAS=["portafolio","trading","eventos"],cargadas={};
function ir(v){
  if(VISTAS.indexOf(v)<0)v="portafolio";
  VISTAS.forEach(function(x){$("#v-"+x).hidden=x!==v});
  $$(".pestanas button").forEach(function(b){b.setAttribute("aria-selected",b.dataset.v===v?"true":"false")});
  if(!cargadas[v]){cargadas[v]=1;({portafolio:cargarPortafolio,trading:cargarTrading,eventos:cargarEventos})[v]()}
  history.replaceState(null,"","#"+v);scrollTo(0,0);
}
$$(".pestanas button").forEach(function(b){b.addEventListener("click",function(){ir(b.dataset.v)})});

/* ---------- Portafolio ---------- */
function cargarPortafolio(){
  json("../datos/torneo-tabla.json").then(function(d){
    if(!d||!d.equipos){$("#pCorte").textContent="No se pudo cargar el ranking.";return}
    $("#pCorte").textContent="Semana "+d.semana+" · corte "+d.corte+" · "+d.equipos.length+" equipos";
    $("#pLista").innerHTML=d.equipos.map(function(e){
      var dl=e.delta>0?'<span class="up">▲'+e.delta+'</span>':e.delta<0?'<span class="down">▼'+(-e.delta)+'</span>':'';
      var m=e.metricas||{};
      return '<div class="eq'+(e.posicion<=3?" top":"")+'"><button aria-expanded="false">'
        +'<span class="pos">'+e.posicion+'</span>'
        +'<span class="nom">'+esc(e.nombre)+'<small>'+pct(e.retRel)+' vs. ACWI '+dl+'</small></span>'
        +'<span class="pts">'+e.puntos.toFixed(1)+'<small>pts</small></span></button>'
        +'<div class="det" hidden><dl>'
        +'<div><dt>Info ratio</dt><dd>'+(m.ir!=null?m.ir.toFixed(2):"–")+'</dd></div>'
        +'<div><dt>Sharpe</dt><dd>'+(m.sharpe!=null?m.sharpe.toFixed(2):"–")+'</dd></div>'
        +'<div><dt>Máx. caída</dt><dd>'+(m.mdd!=null?(m.mdd*100).toFixed(1)+"%":"–")+'</dd></div></dl>'
        +(e.miembros&&e.miembros.length?esc(e.miembros.map(function(x){return x.nombre}).join(" · ")):"")+'</div></div>';
    }).join("");
    $$("#pLista .eq>button").forEach(function(b){
      b.addEventListener("click",function(){var d=b.nextElementSibling,a=d.hidden;d.hidden=!a;b.setAttribute("aria-expanded",a)});
    });
  });
}

/* ---------- Trading ---------- */
function cargarTrading(){
  Promise.all([vivo("tabla_trading"),json("../datos/trading.json")]).then(function(r){
    var t=r[0],info=(r[1]&&r[1].torneo)||{},html="";
    if(t&&t.columnas&&t.filas&&t.filas.length){
      html+='<p class="sub">'+esc(t.titulo||"")+'</p><div class="tabla"><table><thead><tr>'
        +t.columnas.map(function(c){return "<th>"+esc(c)+"</th>"}).join("")+'</tr></thead><tbody>'
        +t.filas.map(function(f){return "<tr>"+f.map(function(c){return "<td>"+esc(c)+"</td>"}).join("")+"</tr>"}).join("")
        +'</tbody></table></div>';
    }else{
      html+='<p class="sub">La tabla aparece acá apenas parta el torneo.</p>';
    }
    html+='<div class="card" style="margin-top:14px"><h3>'+esc(info.titulo||"Alpha Trading Challenge")+'</h3>'
      +'<p>'+esc(info.bajada||"")+'</p>'
      +(info.datos&&info.datos.length?'<dl class="kv">'+info.datos.map(function(kv){return "<dt>"+esc(kv.k)+"</dt><dd>"+esc(kv.v)+"</dd>"}).join("")+'</dl>':"")
      +(info.formUrl?'<a class="btn" href="'+esc(info.formUrl)+'" target="_blank" rel="noopener">Inscríbete</a>':"")+'</div>';
    $("#tCont").innerHTML=html;
  });
}

/* ---------- Eventos ---------- */
var EVENTOS=[];
function cargarEventos(){
  Promise.all([json("../datos/eventos.json"),json("../datos/fotos.json"),vivo("publicaciones")]).then(function(r){
    var man=(r[1]&&r[1].eventos)||{},pubs=Array.isArray(r[2])?r[2]:[];
    var repo=((r[0]&&r[0].eventos)||[]).map(function(e){
      var c=e.carpeta||e.id,f=man[c]||[];
      return {id:e.id,titulo:e.titulo,fecha:e.fecha,fechaTexto:e.fechaTexto,lugar:e.lugar,texto:e.resumen,live:e.live,
        fotos:f.map(function(x){return "../fotos/eventos/"+c+"/"+x.i+".webp"}),
        portada:f.length?"../fotos/eventos/"+c+"/mini/"+f[0].i+".webp":""};
    });
    var directivos=pubs.filter(function(p){return p.clase==="evento"}).map(function(p){
      return {id:"d-"+p.id,titulo:p.titulo,fecha:p.fechaEvento,fechaTexto:fechaTexto(p.fechaEvento),lugar:p.lugar,texto:p.texto,area:p.area,
        fotos:(p.fotos||[]).map(function(id){return fotoDrive(id,1600)}),portada:p.fotos&&p.fotos.length?fotoDrive(p.fotos[0],800):""};
    });
    EVENTOS=directivos.concat(repo);
    var hoy=new Date().toISOString().slice(0,10);
    var prox=EVENTOS.filter(function(e){return e.live||e.fecha>=hoy}).sort(function(a,b){return a.fecha<b.fecha?-1:1});
    var pas=EVENTOS.filter(function(e){return !(e.live||e.fecha>=hoy)}).sort(function(a,b){return a.fecha<b.fecha?1:-1});

    var coms=pubs.filter(function(p){return p.clase==="comunicado"}).slice(0,5);
    $("#eCom").innerHTML=coms.length?'<p class="seccion">Comunicados</p>'+coms.map(function(c){
      return '<div class="card com"><div class="meta"><span class="chip">'+esc(c.area)+'</span>'+esc(fechaTexto(c.fecha))+'</div>'
        +'<h3>'+esc(c.titulo)+'</h3><p>'+esc(c.texto)+'</p></div>'}).join(""):"";

    function tarjeta(e,esProx){
      return '<button class="ev" data-id="'+esc(e.id)+'">'+(e.portada?'<div class="foto" style="background-image:url(\''+esc(e.portada)+'\')"></div>':"")
        +'<div class="cuerpo"><div class="meta">'+(esProx?'<span class="chip prox">'+(e.live?"En curso":"Próximo")+'</span>':"")
        +(e.area?'<span class="chip">'+esc(e.area)+'</span>':"")+esc(e.fechaTexto||e.fecha)+(e.lugar?" · "+esc(e.lugar):"")+'</div>'
        +'<h3>'+esc(e.titulo)+'</h3><p>'+esc(e.texto||"")+'</p></div></button>';
    }
    $("#eLista").innerHTML=(prox.length?'<p class="seccion">Próximos</p>'+prox.map(function(e){return tarjeta(e,true)}).join(""):"")
      +(pas.length?'<p class="seccion">Pasados</p>'+pas.map(function(e){return tarjeta(e,false)}).join(""):"")
      ||'<p class="vacio">Pronto habrá eventos.</p>';
    $$("#eLista .ev").forEach(function(b){b.addEventListener("click",function(){abrir(b.dataset.id)})});
  });
}
function abrir(id){
  var e=EVENTOS.filter(function(x){return x.id===id})[0];if(!e)return;
  var h=$("#hoja");
  h.innerHTML='<button class="cerrar">← Volver</button>'
    +(e.fotos.length?'<div class="gal">'+e.fotos.map(function(f){return '<img src="'+esc(f)+'" alt="" loading="lazy">'}).join("")+'</div>':"")
    +'<div class="txt"><div class="meta" style="color:var(--dim);font-size:12px">'+(e.area?'<span class="chip">'+esc(e.area)+'</span>':"")
    +esc(e.fechaTexto||e.fecha)+(e.lugar?" · "+esc(e.lugar):"")+'</div><h1>'+esc(e.titulo)+'</h1><p>'+esc(e.texto||"")+'</p></div>';
  h.hidden=false;document.body.style.overflow="hidden";
  $(".cerrar",h).onclick=function(){h.hidden=true;document.body.style.overflow=""};
}

ir(location.hash.slice(1));
addEventListener("hashchange",function(){ir(location.hash.slice(1))});
if("serviceWorker" in navigator){addEventListener("load",function(){navigator.serviceWorker.register("../sw.js").catch(function(){})})}
</script>
</body>
</html>
